# The container runs as the unprivileged `nginx` user (see Dockerfile): that is why there is no
# `user` directive, and the pid and temporary files go to /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Origins allowed to download modules from this microfrontend. Module Federation
    # loads them with import(), which requires CORS when host and remote are on different
    # domains. Add the domain of each environment here (exact match).
    map $http_origin $cors_origin {
        default "";

        "http://localhost:8080" $http_origin;
        "http://localhost:8081" $http_origin;

        # "https://app.example.com" $http_origin;
    }

    # One JSON line per request (ready for CloudWatch, Loki, etc.).
    # escape=json stops a tampered header from breaking or forging the JSON.
    log_format json_logs escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout json_logs;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
