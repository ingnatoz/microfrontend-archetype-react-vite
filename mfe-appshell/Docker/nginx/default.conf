# Cache: remoteEntry.js and index.html are always revalidated, so a new deployment reaches
# consumers of this microfrontend without a rebuild. Hashed chunks are immutable.
map $uri $cache_control {
    ~^/assets/remoteEntry\.js$  "no-cache";
    ~^/assets/                  "public, max-age=31536000, immutable";
    default                     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location (none defines its own add_header).
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Without `always`: only on successful responses, so a 404 is not cached for a year.
    add_header Cache-Control $cache_control;

    # Health check for Docker and load balancers.
    location = /status {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # A missing chunk returns 404, never index.html (avoids MIME errors that are hard
    # to trace when a remote requests a chunk from a previous deployment).
    location /assets/ {
        try_files $uri =404;
    }

    # Any other path is SPA navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
